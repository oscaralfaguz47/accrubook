# Runs the same quality gate as `make check` on every pull request and on main.
# The Makefile stays the single source of commands: this file only prepares a
# clean machine and calls make.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only needs to read the code.
permissions:
  contents: read

# A new push to a PR cancels the older run of that PR. Runs on main are never
# cancelled, so every merge commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi-typescript/package-lock.json

      - name: Set up the project (.env, images, frontend deps)
        run: make setup

      - name: Start the services
        run: make up

      - name: Run all checks
        run: make check

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

  # Runs every pre-commit hook on all files, so a commit made with
  # --no-verify (or without `make hooks`) cannot reach main unchecked.
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv (same version as backend/Dockerfile)
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"

      - name: Set up Node (version from frontend/.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/tools/openapi-typescript/package-lock.json

      - name: Install frontend deps (Prettier and oxlint for the hooks)
        run: make frontend-install

      - name: Run every hook on all files
        run: make precommit
