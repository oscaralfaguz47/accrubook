[project]
name = "accrubook-backend"
version = "0.1.0"
description = "Accrubook API: multi-tenant finance operations for consultancies."
authors = [
    { name = "oscaralfaguz47", email = "oscar.alfaguz47@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
accrubook-backend = "accrubook_backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]
