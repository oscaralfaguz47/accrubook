[project]
name = "accrubook-backend"
version = "0.1.0"
description = "Accrubook API: multi-tenant finance operations for consultancies."
authors = [
    { name = "oscaralfaguz47", email = "oscar.alfaguz47@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.9,<5",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
]

[project.scripts]
accrubook-backend = "accrubook_backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes · I: import sorting · B: bugbear · UP: pyupgrade
# DJ: Django rules · S: security (bandit) · SIM: simplifications
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated code: long help_text strings can't be wrapped.
"*/migrations/*" = ["E501"]

"**/tests/**" = ["S101"]  # assert is the point of a test
