# Local development environment. Production does not use this file.
name: accrubook

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432" # reachable only from this machine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app # hot reload: source code is mounted, venv stays in the image
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: